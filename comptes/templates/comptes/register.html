{% extends 'comptes/base.html' %}

{% block title %}Inscription{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-djezzy">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">Créer un compte</h1>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-djezzy w-100 mt-2">S'inscrire</button>
                    </form>
                    <p class="text-center text-muted mt-4 mb-0">
                        Déjà un compte ? <a href="{% url 'login' %}" class="text-decoration-none">Se connecter</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
