<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Djezzy Site{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap_min.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Djezzy Site</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Connexion</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        {% block content %}
        {% endblock %}
    </div>

    <script src="{% static 'bootstrap_bundle_min.js' %}"></script>
</body>
</html>
