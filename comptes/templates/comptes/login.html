{% extends 'comptes/base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-djezzy">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">Connexion</h1>

                    {% if form.errors %}
                        <div class="alert alert-danger">Nom d'utilisateur ou mot de passe incorrect.</div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">

                        <div class="mb-3">
                            <label for="id_username" class="form-label">Nom d'utilisateur</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Mot de passe</label>
                            {{ form.password }}
                        </div>

                        <button type="submit" class="btn btn-djezzy w-100">Se connecter</button>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        Pas encore de compte ? <a href="{% url 'register' %}" class="text-decoration-none">S'inscrire</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
