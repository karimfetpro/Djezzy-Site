{% extends 'comptes/base.html' %}

{% block title %}{% if boutique %}Modifier{% else %}Ajouter{% endif %} une boutique{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="d-flex align-items-center mb-4">
                <a href="{% url 'boutique_list' %}" class="btn btn-outline-secondary btn-sm me-3">← Retour</a>
                <h1 class="h3 mb-0">{% if boutique %}Modifier{% else %}Ajouter{% endif %} une boutique</h1>
            </div>
            <div class="card card-djezzy">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-djezzy">Enregistrer</button>
                            <a href="{% url 'boutique_list' %}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
