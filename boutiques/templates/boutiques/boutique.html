{% extends 'comptes/base.html' %}

{% block title %}Ajouter une boutique{% endblock %}

{% block content %}
    <div class="mx-auto" style="max-width: 500px;">
        <h1 class="mb-4">Ajouter une boutique</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </form>

        <p class="mt-3"><a href="{% url 'boutique_list' %}">Voir mes boutiques</a></p>
    </div>
{% endblock %}
