{% extends 'comptes/base.html' %}

{% block title %}Annuler la commande{% endblock %}

{% block content %}
    <div class="mx-auto" style="max-width: 500px;">
        <h1 class="mb-4">Annuler la commande</h1>
        <div class="alert alert-danger">
            Es-tu sûr de vouloir annuler la <strong>commande #{{ order.pk }}</strong> ?
            Cette action est irréversible.
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Oui, annuler</button>
            <a href="{% url 'order_detail' order.pk %}" class="btn btn-outline-secondary">Retour</a>
        </form>
    </div>
{% endblock %}
