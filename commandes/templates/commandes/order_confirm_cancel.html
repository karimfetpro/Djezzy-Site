{% extends 'comptes/base.html' %}

{% block title %}Annuler la commande{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Annuler la commande</h1>
                    <div class="alert alert-danger">
                        Es-tu sûr de vouloir annuler la <strong>commande #{{ order.pk }}</strong> ? Cette action est irréversible.
                    </div>
                    <form method="post" class="d-flex gap-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Oui, annuler</button>
                        <a href="{% url 'order_detail' order.pk %}" class="btn btn-outline-secondary">Retour</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
