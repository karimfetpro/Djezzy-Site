{% extends 'comptes/base.html' %}

{% block title %}Confirmer la suppression{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Confirmer la suppression</h1>
                    <div class="alert alert-danger">
                        Es-tu sûr de vouloir supprimer <strong>{{ object_name }}</strong> ?
                        {% if warning %}<br><small>{{ warning }}</small>{% endif %}
                    </div>
                    <form method="post" class="d-flex gap-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                        <a href="{% url 'catalog_manage' %}" class="btn btn-outline-secondary">Annuler</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
