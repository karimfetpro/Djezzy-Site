{% extends 'comptes/base.html' %}

{% block title %}{% if categorie %}Modifier{% else %}Ajouter{% endif %} une catégorie{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="h3 mb-4">{% if categorie %}Modifier{% else %}Ajouter{% endif %} une catégorie</h1>
            <div class="card card-djezzy">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-djezzy">Enregistrer</button>
                            <a href="{% url 'catalog_manage' %}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
